<!DOCTYPE html>
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Vendor</title>

    <link rel="stylesheet"
          href="{% static 'css/vendor_reset_password.css' %}">
</head>

<body>

<div class="reset-page">

    <div class="reset-box">

        <h1>Reset Password 🔐</h1>

        <p>Create a new password for your vendor account.</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Reset Password
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'vendor_login' %}">
                ← Back to Vendor Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
