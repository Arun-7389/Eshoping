<!DOCTYPE html>
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Vendor</title>

    <link rel="stylesheet"
          href="{% static 'css/vendor_forgot_password.css' %}">
</head>

<body>

<div class="forgot-page">

    <div class="forgot-box">

        <h1>Forgot Password 🔐</h1>

        <p>
            Enter your registered vendor email to receive an OTP.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your vendor email"
                required
            >

            <button type="submit">
                Send OTP
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'vendor_login' %}">
                ← Back to Vendor Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
